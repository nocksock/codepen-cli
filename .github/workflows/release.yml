name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write # create the release and upload the archives

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs the whole history for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --clean
        env:
          # Also used to generate the release notes from GitHub.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
