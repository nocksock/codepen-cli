version: 2
project_name: pen

builds:
  - id: pen
    main: ./cmd/pen
    binary: pen
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/nocksock/codepen-cli/internal/cli.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes list the commits since the previous tag, enriched through the
# GitHub compare API (so authors link to their account when GitHub knows their
# email). Grouped by conventional-commit type, which the regexps match at the
# start of the subject.
#
# The format is spelled out because goreleaser's default for `use: github` is
# "{{ .SHA }}: {{ .Message }} (…)", and dropping the hash with `abbrev: -1`
# leaves a stray ": " behind.
changelog:
  use: github
  format: '{{ .Message }}{{ with .Logins }} ({{ .Logins | englishJoin }}){{ end }}'
  groups:
    - title: Features
      regexp: '^feat(\([[:word:]]+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^(fix|bug)(\([[:word:]]+\))?!?:.+$'
      order: 1
    - title: Others
      order: 999
